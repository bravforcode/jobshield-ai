[project]
name = "jobshield"
version = "0.1.0"
description = "Thai Occupation Mobility Network — explainable career path recommender"
readme = { content-type = "text/markdown", text = "# JobShield AI\n\nThai Occupation Mobility Network core (Python).\n" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobshield"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests/py"]
pythonpath = ["src", "tests"]
addopts = "-q --tb=short"
